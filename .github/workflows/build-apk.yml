name: Build Chatiux Android APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Instalable (Debug) y Bundle Play Store (AAB)
        run: |
          gradle assembleDebug bundleRelease

      - name: Subir APK listo para instalar en Android
        uses: actions/upload-artifact@v4
        with:
          name: Chatiux-Instalador-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Subir AAB para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Chatiux-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
